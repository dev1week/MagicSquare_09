[project]
name = "magicsquare"
version = "0.1.0"
description = "4x4 magic square solver and verifier"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
]

[project.scripts]
magicsquare = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
